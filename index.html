<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050403">
<title>Pencarian data NPSN | ExamDigital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d9b878; --gold-hi: #f3deab; --gold-lo: #8f713a;
    --ink: #f4eddf; --muted: #a39984; --line: rgba(217,184,120,.24);
    --serif: "Cormorant Garamond", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { background: #050403; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); line-height: 1.55;
    background:
      radial-gradient(880px 520px at 50% -10%, rgba(217,184,120,.17), transparent 70%),
      radial-gradient(560px 380px at 100% 100%, rgba(217,184,120,.06), transparent 70%),
      #050403;
    background-attachment: fixed;
  }
  .wrap { max-width: 740px; margin: 0 auto; padding: 44px 20px 70px; }

  header { text-align: center; margin-bottom: 34px; }
  #headLogo { width: 118px; height: auto; filter: drop-shadow(0 0 22px rgba(217,184,120,.35)); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.9rem, 6vw, 2.5rem); letter-spacing: .05em; margin: 6px 0 6px; color: var(--gold-hi); }
  .sub { margin: 0; color: var(--muted); font-size: .95rem; }
  .rule { height: 1px; width: min(70%, 280px); margin: 22px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  .search {
    display: flex; gap: 8px; align-items: center; padding: 6px;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,248,230,.045);
    transition: border-color .25s, box-shadow .25s;
  }
  .search:focus-within { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217,184,120,.12), 0 8px 40px rgba(217,184,120,.12); }
  .search input {
    flex: 1; min-width: 0; padding: 13px 20px; border: 0; background: transparent;
    color: var(--ink); font: inherit; font-size: 1.05rem; letter-spacing: .04em; outline: none;
  }
  .search input::placeholder { color: #7d7463; letter-spacing: .02em; }
  .search button {
    padding: 13px 28px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    color: #1b1406; font: inherit; font-weight: 600; letter-spacing: .08em;
    transition: filter .2s, transform .2s;
  }
  .search button:hover { filter: brightness(1.08); }
  .search button:active { transform: scale(.97); }
  .search button:disabled { opacity: .55; cursor: progress; }
  .search button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

  .msg { padding: 44px 16px; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 1.2rem; letter-spacing: .02em; }
  .msg.error { color: #e0a27a; }
  .spinner {
    width: 24px; height: 24px; margin: 0 auto 12px; border-radius: 50%;
    border: 2px solid rgba(217,184,120,.2); border-top-color: var(--gold);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats { display: flex; justify-content: center; margin: 30px 0 18px; color: var(--muted); font-size: .92rem; }
  .stats span { padding: 0 18px; }
  .stats span + span { border-left: 1px solid var(--line); }
  .stats strong { color: var(--gold-hi); font-family: var(--serif); font-size: 1.25rem; font-weight: 600; margin: 0 2px; }

  #results { display: grid; gap: 16px; }
  .card {
    position: relative; padding: 22px 24px; border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(160deg, rgba(255,248,230,.07), rgba(255,248,230,.015));
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .lbl { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 2px; }
  .npsn { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; line-height: 1.1; color: var(--gold-hi); letter-spacing: .06em; font-variant-numeric: lining-nums; }
  .time {
    padding: 5px 14px; border: 1px solid var(--gold); border-radius: 999px;
    color: var(--gold-hi); font-size: .88rem; white-space: nowrap; background: rgba(217,184,120,.08);
  }
  .time.zero { border-color: var(--line); color: var(--muted); background: transparent; }
  .ket { margin: 16px 0 0; font-size: 1.04rem; overflow-wrap: anywhere; }
  .link-row { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn-link {
    display: inline-block; padding: 9px 20px; border: 1px solid var(--gold); border-radius: 999px;
    color: var(--gold-hi); text-decoration: none; font-size: .92rem; letter-spacing: .04em;
    transition: background .2s, color .2s;
  }
  .btn-link:hover { background: var(--gold); color: #1b1406; }
  .btn-link:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .host { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }

  footer { margin-top: 56px; text-align: center; color: #6f6656; font-family: var(--serif); font-size: .95rem; letter-spacing: .12em; }

  @media (max-width: 480px) {
    .search button { padding: 13px 20px; }
    .card { padding: 20px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .spinner { animation: none; }
  }

  /* ===== Animasi pembuka ===== */
  body.intro-on { overflow: hidden; }
  .wrap { opacity: 0; transform: translateY(16px); transition: opacity 1s .2s ease, transform 1s .2s ease; }
  body.ready .wrap { opacity: 1; transform: none; }

  #intro {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #1b1408 0%, #060504 55%, #000 100%);
    transition: opacity .9s ease, transform .9s ease, filter .9s ease;
    cursor: pointer;
  }
  #intro.out { opacity: 0; transform: scale(1.07); filter: blur(6px); pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage { position: relative; width: min(74vmin, 500px); aspect-ratio: 1; }

  .halo {
    position: absolute; inset: -30%;
    background: radial-gradient(circle, rgba(232,190,118,.38) 0%, rgba(232,190,118,.12) 35%, rgba(232,190,118,0) 62%);
    opacity: 0;
    animation: halo 2.6s .1s ease-out forwards, breathe 3.4s 2.7s ease-in-out infinite alternate;
  }
  @keyframes halo { 0% { opacity: 0; transform: scale(.35); } 60% { opacity: .95; } 100% { opacity: .6; transform: scale(1); } }
  @keyframes breathe { from { opacity: .6; } to { opacity: .9; } }

  .logo, .sheen { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo {
    object-fit: contain; opacity: 0;
    filter: blur(24px) brightness(2.2); transform: scale(1.2);
    animation: reveal 2.2s .5s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes reveal {
    55% { opacity: 1; }
    100% { opacity: 1; filter: blur(0) brightness(1); transform: scale(1); }
  }
  .sheen {
    -webkit-mask-image: var(--logo); mask-image: var(--logo);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    background: linear-gradient(110deg, transparent 38%, rgba(255,240,200,.95) 50%, transparent 62%);
    background-size: 300% 100%; background-position: 100% 0;
    animation: sweep 1.7s 2.6s ease-in-out forwards;
  }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }

  .caption {
    position: absolute; left: 0; right: 0; bottom: -17%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    color: #dcbb7f; font-size: clamp(.95rem, 2.6vmin, 1.2rem);
  }
  .caption .rule {
    height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, #dcbb7f, transparent);
    animation: rule 1.4s 3s ease-out forwards;
  }
  .caption .t { opacity: 0; letter-spacing: .12em; animation: tag 1.8s 3.2s ease-out forwards; }
  @keyframes rule { to { width: min(60vw, 260px); } }
  @keyframes tag { to { opacity: 1; letter-spacing: .34em; } }

  #skip {
    position: absolute; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: transparent; color: #cfae72; border: 1px solid rgba(207,174,114,.45);
    border-radius: 999px; padding: 7px 16px; font: inherit; font-size: .88rem; cursor: pointer;
    opacity: 0; animation: tag 1s 1s ease-out forwards;
  }
  #skip:hover { background: rgba(207,174,114,.12); }
  #skip:focus-visible { outline: 2px solid #e8be76; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .halo, .logo, .sheen, .caption .rule, .caption .t, #skip { animation: none; }
    .halo { opacity: .55; }
    .logo { opacity: 1; filter: none; transform: none; }
    .sheen { display: none; }
    .caption .rule { width: 200px; }
    .caption .t { opacity: 1; letter-spacing: .3em; }
    #skip { opacity: 1; }
    #intro, .wrap { transition-duration: .3s; }
  }
</style>
</head>
<body class="intro-on">
<div id="intro" role="dialog" aria-label="Pembuka ExamDigital">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="stage">
    <div class="halo"></div>
    <img class="logo" id="introLogo" alt="Logo ExamDigital">
    <div class="sheen" id="introSheen"></div>
    <div class="caption"><div class="rule"></div><div class="t">Pencarian data NPSN</div></div>
  </div>
  <button id="skip" type="button">Lewati</button>
</div>
<noscript><style>#intro{display:none}.wrap{opacity:1!important;transform:none!important}</style></noscript>
<div class="wrap" id="main" inert>
  <header>
    <img id="headLogo" alt="ExamDigital">
    <h1>Pencarian data NPSN</h1>
    <p class="sub">Masukkan NPSN untuk melihat keterangan dan tautannya.</p>
    <div class="rule"></div>
  </header>

  <div class="search" role="search">
    <input id="npsn" type="search" inputmode="numeric" placeholder="Masukkan NPSN" aria-label="NPSN" autocomplete="off">
    <button id="btnLoad" type="button">Cari</button>
  </div>

  <div id="status" class="msg">Masukkan NPSN lalu tekan Cari untuk menampilkan data.</div>

  <div class="stats" id="stats" hidden>
    <span><strong id="sCount">0</strong> data</span>
    <span>Total waktu <strong id="sTime">0</strong> menit</span>
  </div>

  <div id="results"></div>

  <footer>© ExamDigital, Rahestadev</footer>
</div>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycby7pSxPN9ciRdhlczSEs43sNtULry_vYAAVIk_90z13z68ZJGIlp2gENoa7rpQZlrSS/exec";

  const results = document.getElementById("results");
  const input = document.getElementById("npsn");
  const stats = document.getElementById("stats");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("btnLoad");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function safeUrl(u) {
    u = String(u ?? "").trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return u; } }

  function hideData() { results.innerHTML = ""; stats.hidden = true; }

  function setStatus(html, isError) {
    statusEl.hidden = false;
    statusEl.className = "msg" + (isError ? " error" : "");
    statusEl.innerHTML = html;
  }

  function render(list) {
    let total = 0;
    results.innerHTML = list.map((r, i) => {
      const w = Number(r.waktu) || 0;
      total += w;
      const url = safeUrl(r.link);
      const linkRow = url
        ? `<div class="link-row"><a class="btn-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Buka tautan</a><span class="host">${esc(hostOf(url))}</span></div>`
        : "";
      return `<article class="card" style="animation-delay:${i * 90}ms">
        <div class="card-top">
          <div><span class="lbl">NPSN</span><span class="npsn">${esc(r.npsn)}</span></div>
          <span class="time${w === 0 ? " zero" : ""}">${w} menit</span>
        </div>
        <p class="ket">${esc(r.keterangan) || "-"}</p>
        ${linkRow}
      </article>`;
    }).join("");
    document.getElementById("sCount").textContent = list.length;
    document.getElementById("sTime").textContent = total;
    statusEl.hidden = true;
    stats.hidden = false;
  }

  async function cari() {
    const npsn = input.value.trim();
    hideData();
    if (!npsn) { setStatus("Masukkan NPSN terlebih dahulu."); return; }
    btn.disabled = true;
    setStatus('<div class="spinner"></div>Mencari data…');
    try {
      const ambil = async (url) => {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      };
      const cocok = (arr) => arr.filter(r => String(r.npsn).trim() === npsn);
      // 1) filter di server; 2) jika kosong, ambil semua lalu cocokkan di halaman
      let list = cocok(await ambil(`${API_URL}?npsn=${encodeURIComponent(npsn)}`));
      if (!list.length) list = cocok(await ambil(API_URL));
      if (!list.length) setStatus("Data untuk NPSN " + esc(npsn) + " tidak ditemukan.");
      else render(list);
    } catch (err) {
      setStatus("Gagal memuat data (" + esc(err.message) + "). Pastikan Web App sudah di-deploy dengan akses “Anyone”.", true);
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", cari);
  input.addEventListener("keydown", e => { if (e.key === "Enter") cari(); });

    const intro = document.getElementById("intro");
    const main = document.getElementById("main");
    const canvas = document.getElementById("fx");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("introLogo").src = LOGO;
    const hl = document.getElementById("headLogo"); if (hl) hl.src = LOGO;
    intro.style.setProperty("--logo", "url(" + LOGO + ")");

    let done = false, raf = 0, timers = [];

    function finish() {
      if (done) return;
      done = true;
      timers.forEach(clearTimeout);
      cancelAnimationFrame(raf);
      intro.classList.add("out");
      document.body.classList.remove("intro-on");
      main.removeAttribute("inert");
      document.body.classList.add("ready");
      setTimeout(() => { intro.remove(); input.focus({ preventScroll: true }); }, reduce ? 350 : 950);
    }

    intro.addEventListener("click", finish);
    document.getElementById("skip").addEventListener("click", e => { e.stopPropagation(); finish(); });
    document.addEventListener("keydown", e => { if (!done && (e.key === "Escape" || e.key === "Enter" || e.key === " ")) { e.preventDefault(); finish(); } });
    timers.push(setTimeout(finish, reduce ? 1800 : 6200));

    if (reduce) return;

    // Partikel emas
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize(); addEventListener("resize", resize);

    const P = [];
    const gold = () => "hsl(" + (36 + Math.random() * 12) + "," + (60 + Math.random() * 25) + "%," + (62 + Math.random() * 25) + "%)";
    function ambient() {
      return { x: Math.random() * W, y: H + Math.random() * 40, vx: (Math.random() - .5) * .25, vy: -(.15 + Math.random() * .5),
               r: .6 + Math.random() * 1.8, ph: Math.random() * 6.28, sp: .02 + Math.random() * .04, life: 1, decay: 0, c: gold(), a: 0 };
    }
    for (let i = 0; i < 70; i++) { const p = ambient(); p.y = Math.random() * H; p.a = Math.random(); P.push(p); }

    function burst() {
      const cx = W / 2, cy = H / 2 - 10;
      for (let i = 0; i < 90; i++) {
        const ang = Math.random() * 6.283, sp = 1.2 + Math.random() * 4.2;
        P.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: .7 + Math.random() * 2,
                 ph: Math.random() * 6.28, sp: .15, life: 1, decay: .008 + Math.random() * .012, c: gold(), a: 1, drag: .975 });
      }
    }
    timers.push(setTimeout(burst, 1500));
    timers.push(setTimeout(burst, 2900));

    function frame() {
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.ph += p.sp; p.x += p.vx; p.y += p.vy;
        if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
        if (p.decay) { p.life -= p.decay; if (p.life <= 0) { P.splice(i, 1); continue; } }
        else if (p.y < -10) { P[i] = ambient(); continue; }
        const tw = .35 + .65 * Math.abs(Math.sin(p.ph));
        const al = (p.decay ? p.life : Math.min(1, p.a + .02)) * tw;
        if (!p.decay && p.a < 1) p.a += .01;
        ctx.globalAlpha = al * .25; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, 6.283); ctx.fill();
        ctx.globalAlpha = al; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    frame();
  })();
